<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAF3FF"/>
      <stop offset="60%" stop-color="#CFE5FF"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <linearGradient id="fortGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C28847"/>
      <stop offset="100%" stop-color="#8F5927"/>
    </linearGradient>
    <linearGradient id="blueHouses1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="blueHouses2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B3A8F"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0B3A8F" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Sky & Sun -->
  <rect width="800" height="650" rx="28" fill="url(#skyGrad)"/>
  <circle cx="680" cy="110" r="48" fill="#FDE047" opacity="0.85"/>
  <circle cx="680" cy="110" r="64" fill="#FEF08A" opacity="0.35"/>

  <!-- Mehrangarh Fort Mountain Silhouette -->
  <path d="M 50 330 Q 180 250 320 270 T 560 210 T 800 240 L 800 650 L 50 650 Z" fill="#D49A58" opacity="0.6"/>
  <!-- Mehrangarh Fort Structure atop the cliff -->
  <path d="M 420 230 L 420 180 L 450 180 L 450 190 L 480 190 L 480 170 L 520 170 L 520 185 L 560 185 L 560 165 L 610 165 L 610 190 L 660 190 L 660 180 L 710 180 L 710 240 Z" fill="url(#fortGrad)"/>
  <!-- Fort Jharokhas & Battlements -->
  <rect x="490" y="178" width="6" height="10" rx="3" fill="#6B3F1B"/>
  <rect x="502" y="178" width="6" height="10" rx="3" fill="#6B3F1B"/>
  <rect x="575" y="172" width="8" height="12" rx="4" fill="#6B3F1B"/>
  <rect x="590" y="172" width="8" height="12" rx="4" fill="#6B3F1B"/>
  <text x="565" y="150" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#78350F" letter-spacing="1">MEHRANGARH FORT</text>

  <!-- Blue City Rooftops & Buildings of Jodhpur -->
  <!-- Layer 1: Back row houses -->
  <rect x="80" y="310" width="75" height="90" fill="url(#blueHouses1)"/>
  <rect x="145" y="295" width="85" height="105" fill="url(#blueHouses2)"/>
  <rect x="220" y="320" width="70" height="80" fill="url(#blueHouses1)"/>
  <rect x="280" y="300" width="95" height="100" fill="url(#blueHouses2)"/>
  <rect x="365" y="325" width="80" height="75" fill="url(#blueHouses1)"/>
  <rect x="435" y="305" width="90" height="95" fill="url(#blueHouses2)"/>
  <rect x="515" y="320" width="85" height="80" fill="url(#blueHouses1)"/>

  <!-- Layer 2: Middle row blue houses with arches & windows -->
  <rect x="60" y="380" width="110" height="130" rx="4" fill="#2563EB"/>
  <rect x="85" y="405" width="24" height="34" rx="12" fill="#1E3A8A"/>
  <rect x="125" y="405" width="24" height="34" rx="12" fill="#1E3A8A"/>

  <rect x="160" y="365" width="130" height="145" rx="4" fill="#3B82F6"/>
  <rect x="185" y="390" width="28" height="40" rx="14" fill="#1D4ED8"/>
  <rect x="235" y="390" width="28" height="40" rx="14" fill="#1D4ED8"/>
  <!-- Rajasthani Chhatri / dome on rooftop -->
  <path d="M 200 365 Q 225 340 250 365 Z" fill="#60A5FA"/>

  <rect x="280" y="375" width="140" height="135" rx="4" fill="#1D4ED8"/>
  <rect x="310" y="405" width="30" height="42" rx="15" fill="#0B3A8F"/>
  <rect x="365" y="405" width="30" height="42" rx="15" fill="#0B3A8F"/>

  <!-- Happy Traveler Illustration (Foreground Right/Center) -->
  <g transform="translate(420, 260)" filter="url(#cardShadow)">
    <!-- Traveler Body -->
    <!-- Legs / Pants -->
    <rect x="110" y="240" width="28" height="140" rx="8" fill="#1E293B"/>
    <rect x="145" y="240" width="28" height="140" rx="8" fill="#1E293B"/>
    <ellipse cx="124" cy="380" rx="16" ry="8" fill="#0F172A"/>
    <ellipse cx="159" cy="380" rx="16" ry="8" fill="#0F172A"/>

    <!-- Backpack -->
    <rect x="68" y="115" width="38" height="95" rx="16" fill="#F97316"/>
    <rect x="74" y="130" width="24" height="60" rx="8" fill="#EA580C"/>

    <!-- Traveler Shirt (Crisp Clean White Linen) -->
    <path d="M 98 120 L 185 120 L 195 245 L 88 245 Z" fill="url(#shirtGrad)"/>
    <!-- Collar & buttons -->
    <path d="M 125 120 L 141 145 L 158 120 Z" fill="#CBD5E1"/>
    <circle cx="141" cy="165" r="3" fill="#64748B"/>
    <circle cx="141" cy="190" r="3" fill="#64748B"/>
    <circle cx="141" cy="215" r="3" fill="#64748B"/>

    <!-- Left Arm holding branded laundry bag -->
    <path d="M 98 135 L 60 190 L 68 220" stroke="#FBBF24" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- GenZ Premium Laundry Bag -->
    <g transform="translate(15, 200)">
      <path d="M 10 20 C 10 5, 70 5, 70 20 L 78 120 C 78 135, 2 135, 2 120 Z" fill="url(#bagGrad)"/>
      <path d="M 28 20 Q 40 0 52 20" stroke="#93C5FD" stroke-width="4" fill="none"/>
      <!-- Bag Label / Brand -->
      <rect x="18" y="55" width="44" height="44" rx="8" fill="#FFFFFF"/>
      <text x="40" y="74" font-family="'Outfit', 'Poppins', sans-serif" font-size="11" font-weight="900" fill="#0B3A8F" text-anchor="middle">GEN-Z</text>
      <text x="40" y="86" font-family="'Poppins', sans-serif" font-size="6" font-weight="700" fill="#2563EB" text-anchor="middle">LAUNDRY</text>
      <circle cx="40" cy="91" r="1.5" fill="#25D366"/>
      <!-- Fresh Clean Sparkle on bag -->
      <path d="M 68 35 Q 75 35 75 28 Q 75 35 82 35 Q 75 35 75 42 Q 75 35 68 35 Z" fill="#FDE047"/>
    </g>

    <!-- Right Arm waving happily -->
    <path d="M 185 135 L 225 105 L 240 75" stroke="#FBBF24" stroke-width="18" stroke-linecap="round" fill="none"/>
    <circle cx="242" cy="70" r="10" fill="#FBBF24"/>

    <!-- Neck & Head with Traveling Sun Hat -->
    <rect x="131" y="95" width="20" height="28" fill="#FBBF24"/>
    <ellipse cx="141" cy="80" rx="22" ry="24" fill="#FBBF24"/>
    <!-- Sunglasses -->
    <rect x="130" y="72" width="12" height="8" rx="3" fill="#0F172A"/>
    <rect x="144" y="72" width="12" height="8" rx="3" fill="#0F172A"/>
    <line x1="141" y1="76" x2="145" y2="76" stroke="#0F172A" stroke-width="2"/>
    <!-- Smiling Face -->
    <path d="M 134 88 Q 141 94 148 88" stroke="#78350F" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Traveler Hat -->
    <ellipse cx="141" cy="62" rx="36" ry="10" fill="#E2E8F0"/>
    <path d="M 120 62 Q 141 40 162 62 Z" fill="#2563EB"/>
  </g>

  <!-- Floating Tourist Badge Card -->
  <g transform="translate(60, 480)" filter="url(#cardShadow)">
    <rect width="320" height="110" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="50" cy="55" r="26" fill="#EAF3FF"/>
    <path d="M 40 55 L 48 63 L 62 47" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="90" y="44" font-family="'Outfit', sans-serif" font-size="16" font-weight="800" fill="#0B3A8F">Doorstep Delivery in Jodhpur</text>
    <text x="90" y="66" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#64748B">Hotels · Hostels · Heritage Haveli · Airbnb</text>
    <g transform="translate(90, 76)">
      <rect width="105" height="22" rx="11" fill="#DCFCE7"/>
      <circle cx="10" cy="11" r="4" fill="#22C55E"/>
      <text x="22" y="15" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#15803D">Express 6 Hours</text>
    </g>
  </g>
</svg>
