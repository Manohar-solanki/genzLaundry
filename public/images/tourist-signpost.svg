<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="signBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B3A8F" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background decorative circle -->
  <circle cx="300" cy="250" r="220" fill="#EAF3FF"/>
  <circle cx="300" cy="250" r="170" fill="#DBEAFE" opacity="0.6"/>

  <!-- Wooden / Metal Post -->
  <rect x="285" y="60" width="28" height="420" rx="6" fill="#1E293B"/>
  <ellipse cx="299" cy="475" rx="75" ry="16" fill="#CBD5E1"/>

  <!-- Sign 1: Hotel (Pointing Left) -->
  <g transform="translate(140, 95)" filter="url(#softShadow)">
    <path d="M 0 30 L 30 0 L 190 0 L 190 60 L 30 60 Z" fill="#0B3A8F"/>
    <text x="35" y="38" font-family="'Outfit', sans-serif" font-size="22" fill="#FFFFFF">🏨</text>
    <text x="75" y="38" font-family="'Outfit', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">HOTEL</text>
  </g>

  <!-- Sign 2: Hostel (Pointing Right) -->
  <g transform="translate(285, 175)" filter="url(#softShadow)">
    <path d="M 0 0 L 160 0 L 190 30 L 160 60 L 0 60 Z" fill="#2563EB"/>
    <text x="25" y="38" font-family="'Outfit', sans-serif" font-size="22" fill="#FFFFFF">🎒</text>
    <text x="65" y="38" font-family="'Outfit', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">HOSTEL</text>
  </g>

  <!-- Sign 3: Airbnb / Homestay (Pointing Left) -->
  <g transform="translate(130, 255)" filter="url(#softShadow)">
    <path d="M 0 30 L 30 0 L 200 0 L 200 60 L 30 60 Z" fill="#0284C7"/>
    <text x="35" y="38" font-family="'Outfit', sans-serif" font-size="22" fill="#FFFFFF">🏡</text>
    <text x="75" y="38" font-family="'Outfit', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">AIRBNB</text>
  </g>

  <!-- Sign 4: Guest House / Heritage Haveli (Pointing Right) -->
  <g transform="translate(285, 335)" filter="url(#softShadow)">
    <path d="M 0 0 L 180 0 L 210 30 L 180 60 L 0 60 Z" fill="#0F766E"/>
    <text x="25" y="38" font-family="'Outfit', sans-serif" font-size="22" fill="#FFFFFF">🏰</text>
    <text x="65" y="38" font-family="'Outfit', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">GUEST HOUSE</text>
  </g>

  <!-- Chat Bubble Overlay -->
  <g transform="translate(150, 20)" filter="url(#softShadow)">
    <!-- Speech bubble shape -->
    <path d="M 20 0 L 310 0 C 322 0, 330 8, 330 20 L 330 75 C 330 87, 322 95, 310 95 L 85 95 L 60 115 L 68 95 L 20 95 C 8 95, 0 87, 0 75 L 0 20 C 0 8, 8 0, 20 0 Z" fill="#FFFFFF" stroke="#25D366" stroke-width="2.5"/>
    <circle cx="36" cy="38" r="14" fill="#DCFCE7"/>
    <path d="M 30 38 L 35 43 L 43 33" stroke="#22C55E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="60" y="36" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#0A1F4D">No need to find a laundromat.</text>
    <text x="60" y="58" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#16A34A">Just WhatsApp us &amp; we collect! ✨</text>
    <g transform="translate(60, 68)">
      <rect width="130" height="20" rx="10" fill="#25D366"/>
      <text x="65" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">+91 82338 53727</text>
    </g>
  </g>
</svg>
